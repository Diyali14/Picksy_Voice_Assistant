name: pixi_voice_assistant
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # 🗣️ Voice recognition
  speech_to_text: ^6.3.0
  url_launcher: ^6.2.5
  avatar_glow: ^2.0.2
  # 👇 Use local plugin path (REMOVE version line!)
  device_apps:
    path: plugins/device_apps

  flutter_tts: ^4.0.2 
  audioplayers: ^6.5.0
  flutter_audio_waveforms: ^1.0.7

  # ✨ UI Animations
  animated_text_kit: ^4.2.2
  flutter_spinkit: ^5.2.0

  # ⚙️ Utilities
  provider: ^6.0.5
  path_provider: ^2.1.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
